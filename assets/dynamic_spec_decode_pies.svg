<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <title>Time Breakdown Pie Charts</title>
  <defs>
    <style>
      .label { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #2e2e2e; }
      .title { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #1f1f1f; }
      .legend { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #333; }
    </style>
  </defs>

  <!-- Colors -->
  <!-- Verify: #4e79a7, Draft: #f28e2c, Extend: #76b7b2 -->

  <!-- Left Pie: Metrics Set 1 -->
  <g transform="translate(0,0)">
    <text x="250" y="28" text-anchor="middle" class="title">Metrics Set 1</text>
    <!-- Base ring -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#ececec" stroke-width="40"/>
    <!-- Verify (93.9%) -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#4e79a7" stroke-width="40"
            stroke-dasharray="413.06 439.82" transform="rotate(-90 250 130)"/>
    <!-- Draft (3.45%) start angle = -90 + 338.08 = 248.08 -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#f28e2c" stroke-width="40"
            stroke-dasharray="15.17 439.82" transform="rotate(248.08 250 130)"/>
    <!-- Extend (2.64%) start angle = 260.50 -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#76b7b2" stroke-width="40"
            stroke-dasharray="11.60 439.82" transform="rotate(260.50 250 130)"/>

    <!-- Legend -->
    <rect x="110" y="210" width="14" height="14" fill="#4e79a7" rx="2" ry="2"/>
    <text x="130" y="221" class="legend">Verify: 3188.71 ms (93.9%)</text>
    <rect x="110" y="236" width="14" height="14" fill="#f28e2c" rx="2" ry="2"/>
    <text x="130" y="247" class="legend">Draft: 117.12 ms (3.4%)</text>
    <rect x="110" y="262" width="14" height="14" fill="#76b7b2" rx="2" ry="2"/>
    <text x="130" y="273" class="legend">Draft Extend After Decode: 89.60 ms (2.6%)</text>
  </g>

  <!-- Right Pie: Metrics Set 2 -->
  <g transform="translate(400,0)">
    <text x="250" y="28" text-anchor="middle" class="title">Metrics Set 2</text>
    <!-- Base ring -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#ececec" stroke-width="40"/>
    <!-- Verify (88.7%) -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#4e79a7" stroke-width="40"
            stroke-dasharray="390.23 439.82" transform="rotate(-90 250 130)"/>
    <!-- Draft (7.56%) start angle = -90 + 319.46 = 229.46 -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#f28e2c" stroke-width="40"
            stroke-dasharray="33.23 439.82" transform="rotate(229.46 250 130)"/>
    <!-- Extend (3.72%) start angle = 256.66 -->
    <circle cx="250" cy="130" r="70" fill="none" stroke="#76b7b2" stroke-width="40"
            stroke-dasharray="16.36 439.82" transform="rotate(256.66 250 130)"/>

    <!-- Legend -->
    <rect x="110" y="210" width="14" height="14" fill="#4e79a7" rx="2" ry="2"/>
    <text x="130" y="221" class="legend">Verify: 2287.52 ms (88.7%)</text>
    <rect x="110" y="236" width="14" height="14" fill="#f28e2c" rx="2" ry="2"/>
    <text x="130" y="247" class="legend">Draft: 194.75 ms (7.6%)</text>
    <rect x="110" y="262" width="14" height="14" fill="#76b7b2" rx="2" ry="2"/>
    <text x="130" y="273" class="legend">Draft Extend After Decode: 95.95 ms (3.7%)</text>
  </g>

  <!-- Overall caption -->
  <text x="450" y="320" text-anchor="middle" class="label">Breakdown of request time by phase</text>
</svg>

